# CLA 签署检查（2026-11-16，#1793）
#
# 外部贡献者第一次提 PR 时，机器人在 PR 下留言请对方签署 CLA.md；对方回复指定的一句话就算签了，
# 签名记在本仓库的 cla-signatures 分支（signatures/version1/cla.json），不经过任何第三方网站。
# 只在公开仓库跑：私有开发仓库里自己开的 PR 不需要签。
#
# 安全：pull_request_target 带写权限，所以这里绝不 checkout / 运行 PR 里的代码，只调用锁定到提交 SHA 的官方 Action。
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: github.repository == 'HydenLuc/Hyden-Telegram-Helper'
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # v2.6.1
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/HydenLuc/Hyden-Telegram-Helper/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: HydenLuc,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: |
            Thank you for your pull request! Before we can merge it, please read the [Contributor License Agreement](https://github.com/HydenLuc/Hyden-Telegram-Helper/blob/main/CLA.md) and sign it by replying to this pull request with the sentence below. You only need to do this once.
            感谢你的 PR！合并前请先阅读[贡献者协议](https://github.com/HydenLuc/Hyden-Telegram-Helper/blob/main/CLA.md)，然后在本 PR 下原样回复下面这句话完成签署，只需签一次。
